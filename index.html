<!-- THE THIRD DOOR — MULTI-STEP ACCESS MODULE -->
<section class="access-section">

  <div class="access-container">

    <form id="accessForm" action="https://formspree.io/f/mvzdjqvv" method="POST">

      <!-- STEP 1 -->
      <div id="step1">
        <input 
          type="text" 
          name="intent" 
          placeholder="What are you no longer willing to continue?" 
          required
        />

        <button type="button" onclick="goToStep2()">Continue</button>
      </div>

      <!-- STEP 2 -->
      <div id="step2" style="display:none;">
        <input 
          type="email" 
          name="email" 
          placeholder="Enter your email" 
          required
        />

        <input type="hidden" name="_redirect" value="https://thehumanlab.github.io/thethirddoor/thank-you.html">

        <button type="submit">Request Access</button>
      </div>

    </form>

    <p class="access-note">
      You’ll be contacted if selected.
    </p>

  </div>

</section>

<style>
.access-section {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 80px;
}

.access-container {
  text-align: center;
  max-width: 420px;
  width: 100%;
}

.access-container form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}

.access-container input {
  padding: 14px 16px;
  width: 100%;
  border: 1px solid rgba(255,255,255,0.2);
  background: transparent;
  color: #fff;
  font-size: 14px;
  outline: none;
  letter-spacing: 0.5px;
}

.access-container input::placeholder {
  opacity: 0.4;
  color: #aaa;
}

.access-container button {
  padding: 14px 22px;
  border: none;
  background: white;
  color: black;
  cursor: pointer;
  letter-spacing: 1px;
  transition: opacity 0.2s ease;
  width: 100%;
}

.access-container button:hover {
  opacity: 0.8;
}

.access-note {
  margin-top: 12px;
  font-size: 12px;
  opacity: 0.5;
  color: #ccc;
}
</style>

<script>
function goToStep2() {
  const input = document.querySelector('input[name="intent"]');
  
  if (input.value.trim() === "") {
    input.focus();
    return;
  }

  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
}
</script>
