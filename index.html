<!-- THE THIRD DOOR — ACCESS MODULE -->
<section class="access-section">

  <div class="access-container">

    <!-- COIN (ANCHOR ABOVE FORM) -->
    <img src="coin.png" alt="III" class="coin-mark">

    <form id="accessForm" action="https://formspree.io/f/mvzdjqvv" method="POST">

      <!-- STEP 1 -->
      <div id="step1" class="step active">
        <input 
          type="text" 
          name="intent" 
          placeholder="What are you no longer willing to continue?" 
          required
        />
        <button type="button" onclick="goToStep2()">Continue</button>
      </div>

      <!-- STEP 2 -->
      <div id="step2" class="step">
        <input 
          type="email" 
          name="email" 
          placeholder="Enter your email" 
          required
        />

        <input type="hidden" name="_redirect" value="https://thehumanlab.github.io/thethirddoor/thank-you.html">

        <button type="submit">Request Access</button>
      </div>

    </form>

    <p class="access-note">
      You’ll be contacted if selected.
    </p>

  </div>

</section>

<style>

/* BASE */
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* CONTAINER */
.access-section {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 120px;
}

.access-container {
  text-align: center;
  max-width: 420px;
  width: 100%;
}

/* COIN (CONTROLLED, NOT BACKGROUND) */
.coin-mark {
  width: 70px;
  margin-bottom: 30px;
  opacity: 0.75;
  filter: contrast(1.1) brightness(0.95);
}

/* FORM */
.access-container form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}

/* STEP CONTROL */
.step {
  width: 100%;
  display: none;
  flex-direction: column;
  gap: 14px;
}

.step.active {
  display: flex;
}

/* INPUT */
.access-container input {
  padding: 16px;
  width: 100%;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  font-size: 14px;
  outline: none;
  letter-spacing: 0.5px;
}

/* PLACEHOLDER */
.access-container input::placeholder {
  color: rgba(255,255,255,0.4);
}

/* BUTTON */
.access-container button {
  padding: 16px;
  width: 100%;
  background: #fff;
  color: #000;
  border: none;
  cursor: pointer;
  letter-spacing: 1px;
  transition: opacity 0.2s ease;
}

.access-container button:hover {
  opacity: 0.8;
}

/* NOTE */
.access-note {
  margin-top: 14px;
  font-size: 12px;
  opacity: 0.5;
}

</style>

<script>
function goToStep2() {
  const input = document.querySelector('input[name="intent"]');
  const step1 = document.getElementById("step1");
  const step2 = document.getElementById("step2");

  if (!input.value.trim()) {
    input.focus();
    return;
  }

  step1.classList.remove("active");
  step2.classList.add("active");
}
</script>
