<!-- THE THIRD DOOR — MULTI-STEP ACCESS MODULE -->
<section class="access-section">

  <div class="access-container">

    <form id="accessForm" action="https://formspree.io/f/mvzdjqvv" method="POST">

      <!-- STEP 1 -->
      <div id="step1">
        <input 
          type="text" 
          name="intent" 
          placeholder="What are you no longer willing to continue?" 
          required
        />

        <button type="button" onclick="goToStep2()">Continue</button>
      </div>

      <!-- STEP 2 -->
      <div id="step2" style="display:none;">
        <input 
          type="email" 
          name="email" 
          placeholder="Enter your email" 
          required
        />

        <input type="hidden" name="_redirect" value="https://thehumanlab.github.io/thethirddoor/thank-you.html">

        <button type="submit">Request Access</button>
      </div>
<img src="coin.png" alt="III" class="coin-mark">
    </form>

    <p class="access-note">
      You’ll be contacted if selected.
    </p>

  </div>

</section>
.coin-mark {
  width: 60px;
  margin-bottom: 30px;
  opacity: 0.7;
  filter: contrast(1.1) brightness(0.95);
}
<style>
/* FORCE DARK BASE */
body {
  background: #000 !important;
  color: #fff !important;
  margin: 0;
}
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;

  /* COIN AS BACKGROUND */
  background-image: url('coin.png');
  background-repeat: no-repeat;
  background-position: center 65%;
  background-size: 600px;
}
/* CONTAINER */
.access-section {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 120px;
}

.access-container {
  text-align: center;
  max-width: 420px;
  width: 100%;
}

/* FORM LAYOUT */
.access-container form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}

/* INPUT FIX (THIS SOLVES YOUR TYPING ISSUE) */
.access-container input {
  padding: 16px;
  width: 100%;
  background: transparent !important;
  border: 1px solid rgba(255,255,255,0.25);
  color: #ffffff !important;
  font-size: 14px;
  outline: none;
  letter-spacing: 0.5px;
  z-index: 10;
  position: relative;
}

/* FORCE TEXT VISIBILITY */
.access-container input:focus {
  color: #ffffff !important;
}

/* PLACEHOLDER */
.access-container input::placeholder {
  color: rgba(255,255,255,0.4);
}

/* BUTTON */
.access-container button {
  padding: 16px;
  width: 100%;
  background: #ffffff;
  color: #000;
  border: none;
  cursor: pointer;
  letter-spacing: 1px;
  transition: opacity 0.2s ease;
}

.access-container button:hover {
  opacity: 0.8;
}

/* NOTE */
.access-note {
  margin-top: 14px;
  font-size: 12px;
  opacity: 0.5;
}
</style>

<script>
function goToStep2() {
  const input = document.querySelector('input[name="intent"]');

  if (!input.value.trim()) {
    input.focus();
    return;
  }

  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
}
</script>
