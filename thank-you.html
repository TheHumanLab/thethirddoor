<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Received</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #eaeaea;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 40px;
    }

    h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    p {
      font-size: 14px;
      opacity: 0.7;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Received.</h1>

    <p>
      Your request has been logged.<br>
      If selected, you will be contacted directly.
    </p>

    <a href="https://thehumanlab.github.io/thethirddoor/">Return</a>
  </div>

</body>
</html>
